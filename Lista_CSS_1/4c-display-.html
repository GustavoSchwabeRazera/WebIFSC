<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>4c - Position</title>

    <style>

        body {
            margin: 0;
            width: 100vw;
            height: 100vh;
            position: relative;
        }

        div {
            position: absolute;
            width: 35px;
            height: 35px;
            text-align: center;
            line-height: 35px;
        }

        .um {
            background-color: red;
            top: 0;
            left: 0;
        }

        .dois {
            background-color: yellow;
            top: 0;
            right: 0;
        }

        .tres {
            background-color: magenta;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        }

        .quatro {
            background-color: blue;
            bottom: 0;
            left: 0;
        }

        .cinco {
            background-color: green;
            bottom: 0;
            right: 0;
        }

    </style>
</head>

<body>

    <div class="um">1</div>
    <div class="dois">2</div>
    <div class="tres">3</div>
    <div class="quatro">4</div>
    <div class="cinco">5</div>

</body>
</html>
