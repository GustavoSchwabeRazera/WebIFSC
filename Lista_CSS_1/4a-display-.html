<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>4a - Display</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        div {
            display: block;
            width: 100vw;
            height: 25vh;
            text-align: center;
            padding-top: 30px;
            font-size: 20px;
        }

        .um {
            background-color: #7000ff;
        }

        .dois {
            background-color: green;
        }

        .tres {
            background-color: red;
        }

        .quatro {
            background-color: yellow;
        }
    </style>
</head>

<body>

    <div class="um">1</div>
    <div class="dois">2</div>
    <div class="tres">3</div>
    <div class="quatro">4</div>

</body>
</html>
