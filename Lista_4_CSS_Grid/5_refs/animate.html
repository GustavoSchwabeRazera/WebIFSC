<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Animate</title>

    <style>
        .quadrado {
            width: 100px;
            height: 100px;
            background-color: red;
            animation: mover 2s infinite;
        }

        @keyframes mover {
            from {
                margin-left: 0;
            }

            to {
                margin-left: 300px;
            }
        }
    </style>
</head>
<body>
    <h1>Animate</h1>
    <p>Animation permite criar animações usando CSS.</p>

    <div class="quadrado"></div>

    <br>

    <a href="../5.html">Voltar</a>
</body>
</html>
