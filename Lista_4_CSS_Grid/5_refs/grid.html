<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Grid</title>

    <style>
        .grid {
            display: grid;
            grid-template-columns: 100px 100px;
            gap: 10px;
        }

        .grid div {
            height: 100px;
            background-color: lightgreen;
        }
    </style>
</head>
<body>
    <h1>Grid</h1>
    <p>Grid é usado para organizar elementos em linhas e colunas.</p>

    <div class="grid">
        <div>1</div>
        <div>2</div>
        <div>3</div>
        <div>4</div>
    </div>

    <br>

  <a href="../5.html">Voltar</a>
</body>
</html>
