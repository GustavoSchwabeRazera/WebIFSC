<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Layout Responsivo</title>

    <style>
        body {
            margin: 0;
            font-family: Arial;
        }

        .pagina {
            min-height: 100vh;
            display: grid;
            grid-template-columns: 1fr 4fr 1fr;
            grid-template-rows: 80px 70px 1fr 70px 60px;
            gap: 5px;
            padding: 10px;
        }

        header {
            background-color: #f5b900;
            grid-column: 1 / 4;
        }

        .esquerda {
            background-color: #08a85a;
            grid-row: 2 / 5;
        }

        .banner {
            background-color: #df3b31;
        }

        main {
            background-color: #4285e5;
        }

        .direita {
            background-color: #f5b900;
            grid-column: 3;
            grid-row: 2 / 5;
        }

        .baixo {
            background-color: #08a85a;
        }

        footer {
            background-color: #4285e5;
            grid-column: 1 / 4;
        }

        header,
        .esquerda,
        .banner,
        main,
        .direita,
        .baixo,
        footer {
            padding: 15px;
        }

        @media screen and (max-width: 600px) {

            .pagina {
                display: flex;
                flex-direction: column;
            }

            header {
                height: 60px;
            }

            .banner {
                height: 50px;
            }

            .esquerda {
                height: 50px;
            }

            main {
                height: 500px;
            }

            .direita {
                height: 50px;
            }

            .baixo {
                height: 50px;
            }

            footer {
                height: 50px;
            }
        }
    </style>
</head>

<body>

    <div class="pagina">

        <header>Header</header>

        <aside class="esquerda">Left Aside</aside>

        <div class="banner">Banner</div>

        <main>Main Content</main>

        <aside class="direita">Right Aside</aside>

        <div class="baixo">Low Content</div>

        <footer>Footer</footer>

    </div>

</body>

</html>
