<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Layout</title>

    <style>
        body {
            margin: 0;
        }

        .pagina {
            min-height: 100vh;
            display: grid;
            grid-template-columns: 25% 75%;
            grid-template-rows: 100px 1fr 80px;
        }

        header {
            background-color: #e72d7c;
            grid-column: 1 / 3;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 30px;
        }

        nav {
            background-color: #c2bf87;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 25px;
        }

        main {
            background-color: #e8ad80;
            padding: 30px;
            font-size: 25px;
        }

        footer {
            background-color: #80b3a1;
            grid-column: 1 / 3;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 25px;
        }
    </style>
</head>

<body>

    <div class="pagina">

        <header>
            Header
        </header>

        <nav>
            Nav
        </nav>

        <main>
            Content
        </main>

        <footer>
            Footer
        </footer>

    </div>

</body>

</html>
