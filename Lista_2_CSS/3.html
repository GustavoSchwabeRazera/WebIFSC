<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <title>Usuários</title>

    <style>
        body {
            font-family: Arial;
        }

        .fundo {
            width: 600px;
            height: 300px;
            background-color: #aaa;
            margin: 50px auto;

            display: flex;
            justify-content: center;
            align-items: center;
        }

        .lista {
            width: 255px;
            background-color: white;
            padding: 10px;
        }

        .usuario {
            display: flex;
            align-items: center;
            padding: 7px;
            border-bottom: 1px solid #eee;
        }

        .usuario img {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            margin-right: 12px;
        }

        .nome {
            font-size: 13px;
            font-weight: bold;
            margin: 0;
        }

        .endereco {
            font-size: 11px;
            color: #999;
            margin-top: 4px;
        }
    </style>
</head>

<body>

    <div class="fundo">

        <div class="lista">

            <div class="usuario">
                <img src="https://randomuser.me/api/portraits/women/44.jpg">
                <div>
                    <p class="nome">Linda Hart</p>
                    <p class="endereco">6765 Shady Ln Dr</p>
                </div>
            </div>

            <div class="usuario">
                <img src="https://randomuser.me/api/portraits/men/32.jpg">
                <div>
                    <p class="nome">Roger Medina</p>
                    <p class="endereco">2420 Paddock Way</p>
                </div>
            </div>

            <div class="usuario">
                <img src="https://randomuser.me/api/portraits/men/40.jpg">
                <div>
                    <p class="nome">Dean Sullivan</p>
                    <p class="endereco">6727 Airplane Ave</p>
                </div>
            </div>

            <div class="usuario">
                <img src="https://randomuser.me/api/portraits/women/65.jpg">
                <div>
                    <p class="nome">Elizabeth Austin</p>
                    <p class="endereco">6685 Blossom Hill Rd</p>
                </div>
            </div>

        </div>

    </div>

</body>

</html>
