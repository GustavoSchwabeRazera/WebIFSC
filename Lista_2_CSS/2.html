<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Layout</title>

    <style>
        body {
            margin: 0;
            height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;
        }

        .card {
            width: 210px;
            height: 360px;
            border: 2px solid #c000ff;

            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .logo {
            margin-top: 25px;
            color: #999;
            font-family: Arial;
            font-size: 12px;
        }

        .menu {
            width: 82%;
            margin-top: 34px;

            display: flex;
            flex-direction: column;
            gap: 11px;
        }

        .menu div {
            height: 17px;
            background-color: #eee;
            border-radius: 3px;
        }

        .perfil {
            margin-top: auto;
            margin-bottom: 23px;

            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 11px;
        }

        .circulo {
            width: 45px;
            height: 45px;
            background-color: #ddd;
            border-radius: 50%;
        }

        .barra {
            width: 76px;
            height: 18px;
            background-color: #eee;
            border-radius: 3px;
        }
    </style>
</head>

<body>

    <div class="card">

        <div class="logo">
            Company Logo
        </div>

        <div class="menu">
            <div></div>
            <div></div>
            <div></div>
            <div></div>
        </div>

        <div class="perfil">
            <div class="circulo"></div>
            <div class="barra"></div>
        </div>

    </div>

</body>
</html>
