<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <title>Imagens</title>

    <style>
        body {
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .fotos {
            display: flex;
            gap: 10px;
            height: 265px;
        }

        .foto {
            width: 42px;
            border-radius: 25px;
            overflow: hidden;
        }

        .foto.grande {
            width: 360px;
        }

        .foto img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
    </style>
</head>

<body>

    <div class="fotos">

        <div class="foto">
            <img src="https://picsum.photos/300/500?random=1">
        </div>

        <div class="foto grande">
            <img src="https://picsum.photos/600/400?random=2">
        </div>

        <div class="foto">
            <img src="https://picsum.photos/300/500?random=3">
        </div>

        <div class="foto">
            <img src="https://picsum.photos/300/500?random=4">
        </div>

        <div class="foto">
            <img src="https://picsum.photos/300/500?random=5">
        </div>

    </div>

</body>

</html>
