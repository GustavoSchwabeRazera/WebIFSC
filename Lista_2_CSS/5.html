<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <title>Layout Flex</title>

    <style>
        body {
            margin: 40px;
        }

        header {
            background-color: #96d600;
            height: 70px;
            padding: 15px;
        }

        main {
            display: flex;
            height: 285px;
        }

        article {
            flex: 3;
            padding: 15px;
        }

        aside {
            flex: 1;
            background-color: #fffde0;
            padding: 15px;
        }

        nav {
            flex: 1;
            background-color: #d9ecd5;
            padding: 15px;
        }

        footer {
            background-color: #96d600;
            height: 60px;
            padding: 15px;
        }
    </style>
</head>

<body>

    <header>Header</header>

    <main>
        <article>Article</article>
        <aside>Aside</aside>
        <nav>Nav</nav>
    </main>

    <footer>Footer</footer>

</body>

</html>
