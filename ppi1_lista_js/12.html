<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Questão 12 - Local Storage</title>
</head>
<body>
  <input type="text" id="nameInput" placeholder="Digite seu nome">
  <button id="saveButton">Salvar</button>
  <p id="greeting"></p>

  <script>
    const nameInput = document.getElementById("nameInput");
    const saveButton = document.getElementById("saveButton");
    const greeting = document.getElementById("greeting");

 
    function mostrarSaudacao(nome) {
      greeting.textContent = "Olá, " + nome + "!";
    }

  
    const nomeSalvo = localStorage.getItem("nome");
    if (nomeSalvo) {
      mostrarSaudacao(nomeSalvo);
      nameInput.value = nomeSalvo;
    }

  
    saveButton.addEventListener("click", function () {
      const nome = nameInput.value.trim();

      if (nome === "") {
        greeting.textContent = "Por favor, digite um nome.";
        return;
      }

      localStorage.setItem("nome", nome);
      mostrarSaudacao(nome);
    });
  </script>
</body>
</html>
